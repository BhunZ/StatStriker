services:
  - type: web
    name: statstriker-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    plan: free
    # The Python version lives in .python-version, which both this service and the
    # GitHub Actions job read. It used to be pinned here to "3.12" while the running
    # service reported 3.14.3 — this file is not necessarily what configures a service
    # that was created from the dashboard, so a value here is not evidence about
    # production. `GET /api/health` reports the versions actually in use.
