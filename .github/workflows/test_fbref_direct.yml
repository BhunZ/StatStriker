name: Test FBRef Direct Fetch

# Manual-only diagnostic: probes whether GitHub Actions Azure IPs can fetch
# FBRef team-stats pages directly (without ScraperAPI / premium proxies).
# If this returns 200, we can bypass ScraperAPI for the team-stats scrape.
# If it returns 403/429/500, FBRef blocks GitHub IPs and we need an alternative.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe FBRef team-stats endpoints directly
        run: |
          python - <<'PY'
          import sys
          import time
          import urllib.request
          import urllib.error

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          )
          HEADERS = {
              "User-Agent": UA,
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip, deflate, br",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          SEASONS = ["2023-2024", "2024-2025", "2025-2026"]
          STAT_TYPES = ["stats", "keepers", "shooting", "playingtime", "misc"]

          # Also test the fixtures URL as a control (we know this one works
          # via ScraperAPI standard proxies — does it work direct too?)
          control_url = (
              "https://fbref.com/en/comps/9/2024-2025/schedule/"
              "Premier-League-Scores-and-Fixtures"
          )
          print(f"--- CONTROL: fixtures page ---")
          try:
              req = urllib.request.Request(control_url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read()
                  print(f"  status={resp.status}  bytes={len(body)}")
          except urllib.error.HTTPError as e:
              print(f"  HTTPError status={e.code}  reason={e.reason}")
          except Exception as e:
              print(f"  ERROR: {type(e).__name__}: {e}")

          time.sleep(3)

          print()
          print(f"--- TEAM STATS PAGES ---")
          results = {}
          for season in SEASONS:
              for stat in STAT_TYPES:
                  url = (
                      f"https://fbref.com/en/comps/9/{season}/{stat}/"
                      f"Premier-League-Stats"
                  )
                  label = f"{season}/{stat}"
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          body = resp.read()
                          status = resp.status
                          size = len(body)
                          print(f"  {label}: status={status}  bytes={size}")
                          results[label] = status
                  except urllib.error.HTTPError as e:
                      print(f"  {label}: HTTPError status={e.code}  reason={e.reason}")
                      results[label] = e.code
                  except Exception as e:
                      print(f"  {label}: ERROR {type(e).__name__}: {e}")
                      results[label] = -1
                  time.sleep(4)  # polite delay between pages

          print()
          print(f"--- SUMMARY ---")
          ok = sum(1 for v in results.values() if v == 200)
          total = len(results)
          print(f"  {ok}/{total} pages returned HTTP 200")
          for label, status in results.items():
              marker = "OK" if status == 200 else "FAIL"
              print(f"    [{marker}] {label}: {status}")

          # Exit non-zero only if EVERYTHING failed (so we still see the data
          # in the logs even on partial success)
          if ok == 0:
              print("All probes failed — FBRef blocks GitHub Actions IPs.")
              sys.exit(2)
          PY
