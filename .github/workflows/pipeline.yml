name: Weekly Pipeline

on:
  schedule:
    # Every Monday at 06:00 UTC (1 PM in Bangkok / ICT)
    - cron: "0 6 * * 1"
  workflow_dispatch:       # Allow manual trigger from GitHub UI
    inputs:
      force_train:
        description: "Retrain even if the state says it is not due (scrapes nothing)"
        type: boolean
        default: false

permissions:
  contents: write          # Needed for git push

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Read from .python-version, never hardcoded here. This job commits pickled models
      # that a different machine has to unpickle, so the version it runs on is part of the
      # artifact. The same file is what the deployed service reads.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Runs before the pipeline on purpose. A change that breaks entity resolution or
      # lets a rolling feature see its own match would otherwise be found by nobody —
      # the pipeline would keep going green and keep committing.
      - name: Tests
        run: pytest -q

      # The scheduled run is always --auto: it decides for itself whether there is new
      # data and whether a retrain is due. force_train exists only for manual runs, so
      # models can be regenerated on demand without waiting for fixtures to be played.
      - name: Run pipeline
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_API_KEY_SECONDARY: ${{ secrets.SCRAPER_API_KEY_SECONDARY }}
        run: |
          set +e
          if [ "${{ inputs.force_train }}" == "true" ]; then
            echo "Manual run with force_train — retraining on existing data"
            python main.py --force-train
          else
            python main.py --auto
          fi
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_ENV"
          # 0 = nothing changed, 2 = new data, 3 = retrained — all fine.
          # 4 = the data quality gate rejected the scrape. The pipeline itself worked, so
          # this is not a crash, but nothing may be committed and the run must go red or
          # a broken scraper would look like a quiet week.
          if [ "$EXIT_CODE" -eq 4 ]; then
            echo "::error::Data quality gate rejected the scrape — nothing committed"
            exit 1
          fi
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "Pipeline failed with error"
            exit 1
          fi
          echo "Pipeline completed with exit code $EXIT_CODE"

      # The gate that was missing. Models are pickled here and unpickled by the deployed
      # API, and a scikit-learn estimator carries references to that library's internals —
      # when the two hosts disagreed, both sklearn-bearing files died with a
      # ModuleNotFoundError and the site served an empty team list. Verifying in the
      # training process proves nothing, because the objects never travel through pickle.
      # This is a fresh process reading only what is on disk, and it is the last thing to
      # pass before anything is committed.
      - name: Verify the artifacts load in a fresh process
        if: env.exit_code == '2' || env.exit_code == '3'
        run: |
          python scripts/verify_artifacts.py || {
            echo "::error::Trained models cannot be loaded back — refusing to commit them"
            exit 1
          }

      - name: Commit and push changes
        if: env.exit_code == '2' || env.exit_code == '3'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/ data/processed/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          if [ "${{ env.exit_code }}" == "3" ]; then
            MSG="chore: retrain models ($(date -u +%Y-%m-%d))"
          else
            MSG="chore: update data ($(date -u +%Y-%m-%d))"
          fi
          git commit -m "$MSG"
          git push
