name: Test FBRef via ScraperAPI Standard Pool

# Manual-only diagnostic: probes whether FBRef team-stats pages can be
# fetched via ScraperAPI's STANDARD (non-premium) proxy pool. The current
# scraper hardcodes premium=True for team stats, which fails on the free
# plan with HTTP 500. This probe tells us if dropping premium=True is enough.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Probe team-stats via ScraperAPI standard pool
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_API_KEY_SECONDARY: ${{ secrets.SCRAPER_API_KEY_SECONDARY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import urllib.request
          import urllib.error
          import urllib.parse

          PRIMARY = os.environ.get("SCRAPER_API_KEY", "")
          SECONDARY = os.environ.get("SCRAPER_API_KEY_SECONDARY", "")
          if not PRIMARY:
              print("ERROR: SCRAPER_API_KEY not set"); sys.exit(1)

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          )
          HEADERS = {
              "User-Agent": UA,
              "Accept-Language": "en-US,en;q=0.9",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          def wrap(target, key):
              params = urllib.parse.urlencode({"api_key": key, "url": target})
              return f"http://api.scraperapi.com/?{params}"

          def fetch(target, key, timeout=90):
              req = urllib.request.Request(wrap(target, key), headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      body = resp.read()
                      return resp.status, len(body), None
              except urllib.error.HTTPError as e:
                  return e.code, 0, str(e.reason)
              except Exception as e:
                  return -1, 0, f"{type(e).__name__}: {e}"

          SEASONS = ["2023-2024", "2024-2025", "2025-2026"]
          STAT_TYPES = ["stats", "keepers", "shooting", "playingtime", "misc"]

          # ---- Control: fixtures via standard pool (we know this works) ----
          print("--- CONTROL: fixtures via ScraperAPI standard pool ---")
          ctrl_url = (
              "https://fbref.com/en/comps/9/2024-2025/schedule/"
              "Premier-League-Scores-and-Fixtures"
          )
          status, size, err = fetch(ctrl_url, PRIMARY)
          print(f"  fixtures 2024-2025: status={status} bytes={size} err={err}")

          time.sleep(5)

          # ---- Team stats via standard pool (no premium=True) -------------
          print()
          print("--- TEAM STATS via ScraperAPI standard pool (PRIMARY key) ---")
          results = {}
          for season in SEASONS:
              for stat in STAT_TYPES:
                  url = (
                      f"https://fbref.com/en/comps/9/{season}/{stat}/"
                      f"Premier-League-Stats"
                  )
                  label = f"{season}/{stat}"
                  status, size, err = fetch(url, PRIMARY)
                  print(f"  {label}: status={status} bytes={size} err={err}")
                  results[label] = status
                  time.sleep(5)  # polite delay between calls

          print()
          print("--- SUMMARY (PRIMARY) ---")
          ok = sum(1 for v in results.values() if v == 200)
          print(f"  {ok}/{len(results)} pages returned HTTP 200")
          for label, status in results.items():
              marker = "OK" if status == 200 else "FAIL"
              print(f"    [{marker}] {label}: {status}")

          # ---- If primary mostly failed, try the same with secondary key ---
          if ok < len(results) and SECONDARY:
              print()
              print("--- RETRY FAILURES via SECONDARY key ---")
              results2 = {}
              for label, status in results.items():
                  if status == 200:
                      continue
                  season, stat = label.split("/")
                  url = (
                      f"https://fbref.com/en/comps/9/{season}/{stat}/"
                      f"Premier-League-Stats"
                  )
                  s2, sz2, er2 = fetch(url, SECONDARY)
                  print(f"  {label}: status={s2} bytes={sz2} err={er2}")
                  results2[label] = s2
                  time.sleep(5)

              ok2 = sum(1 for v in results2.values() if v == 200)
              print()
              print(f"--- SECONDARY RESCUED: {ok2} additional pages ---")

          print()
          print("--- VERDICT ---")
          if ok == len(results):
              print("  ALL pages OK on standard pool — drop premium=True from fbref_scraper.py")
          elif ok > 0:
              print(f"  PARTIAL ({ok}/{len(results)}) on standard pool — retries may close the gap")
          else:
              print("  NONE worked on standard pool — must escalate to alternative service")
          PY
